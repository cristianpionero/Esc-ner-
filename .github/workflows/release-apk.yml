name: Build & Publish APK to GitHub Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versión (ej: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystores
        run: |
          # 1. Restaurar debug.keystore si existe base64
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          
          # 2. Generar upload keystore si no existe para que assembleRelease nunca falle
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=SparkVision, OU=Retail, O=SparkVision, L=Bogota, C=CO"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Android APKs (Debug & Release)
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Release APK Files
        run: |
          mkdir -p release-assets
          
          # Copiar y renombrar APKs con nombres legibles
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-assets/SparkVisionStock-release.apk
          fi
          
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-assets/SparkVisionStock-debug.apk
          fi
          
          ls -la release-assets/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
          echo "Tag a publicar: $TAG"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: "SparkVision Stock ${{ steps.tag_info.outputs.TAG_NAME }}"
          body: |
            ## 📱 SparkVision Stock — APK Oficial
            Calculadora visual y escáner de productos para tiendas de barrio.
            
            ### 📥 Descargas Disponibles:
            - **`SparkVisionStock-release.apk`**: Versión optimizada de producción lista para instalar.
            - **`SparkVisionStock-debug.apk`**: Versión universal de depuración compatible con cualquier teléfono Android.
            
            *(No requiere almacenamiento de artefactos de GitHub Actions, sin límites de cuota).*
          files: release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
