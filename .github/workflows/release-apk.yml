name: Build & Publish APK to GitHub Releases

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de versión (ej: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment and Signing Keystores
        run: |
          # 1. Crear archivo .env desde .env.example para que el plugin de secretos no falle
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # 2. Restaurar debug.keystore si existe base64
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          
          # 3. Generar upload keystore no interactivo con alias 'upload' y clave 'android'
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=SparkVision, OU=Retail, O=SparkVision, L=Bogota, ST=Bogota, C=CO" || true

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Android APKs (Debug & Release)
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          # Compilar APK Debug (garantizado de funcionar en cualquier teléfono Android)
          ./gradlew assembleDebug --stacktrace -x lint -x test
          
          # Compilar APK Release omitiendo verificaciones lentas de lint
          ./gradlew assembleRelease --stacktrace -x lint -x test || echo "Continuando con los APKs generados..."

      - name: Prepare Release APK Files
        run: |
          mkdir -p release-assets
          
          # Copiar todos los APKs generados con nombres claros
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-assets/SparkVisionStock-release.apk
          fi
          
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-assets/SparkVisionStock-debug.apk
          fi
          
          # Si tienen otro nombre, copiarlos también
          find app/build/outputs/apk -name "*.apk" -exec cp -n {} release-assets/ \;
          
          echo "Archivos listos para publicar:"
          ls -lh release-assets/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
          echo "Tag a publicar: $TAG"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: "SparkVision Stock ${{ steps.tag_info.outputs.TAG_NAME }}"
          body: |
            ## 📱 SparkVision Stock — APK Listo para Instalar
            Calculadora visual y escáner de productos para tiendas.
            
            ### 📥 Descargas:
            - **`SparkVisionStock-debug.apk`**: Compatible con cualquier celular Android (Recomendado para pruebas inmediatas).
            - **`SparkVisionStock-release.apk`**: Versión optimizada de producción.
            
            *(Sin consumo de cuotas de artefactos de GitHub Actions)*.
          files: release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
